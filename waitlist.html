<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Join the CrateSeek waitlist. Discover playable music beyond the algorithm and find your next sample.">
  <meta property="og:title" content="CrateSeek — Join the waitlist">
  <meta property="og:description" content="A better way to find the sounds everyone else missed.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://xanderstiekema-alt.github.io/crateseek-site/waitlist.html">
  <meta property="og:image" content="https://xanderstiekema-alt.github.io/crateseek-site/assets/og-mono.png">
  <meta name="twitter:card" content="summary_large_image">
  <title>CrateSeek — Join the waitlist</title>
  <link rel="icon" href="assets/favicon-app-v2.png" type="image/png">
  <link rel="stylesheet" href="site.css">
  <link rel="stylesheet" href="landing.css">
</head>
<body class="landing-page">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <nav class="nav shell" aria-label="Main navigation">
      <a class="brand" href="index.html" aria-label="CrateSeek home">
        <img src="assets/favicon-app-v2.png" width="34" height="34" alt="">
        <span>CrateSeek</span>
      </a>
      <span class="beta-status"><span aria-hidden="true"></span> iPhone beta</span>
    </nav>
  </header>

  <main id="main" class="waitlist-main">
    <section class="waitlist-hero shell" aria-labelledby="waitlist-title">
      <div class="waitlist-copy">
        <h1 id="waitlist-title">Find the sample everyone else missed.</h1>
        <p class="lede">CrateSeek takes you beyond the algorithm. Shuffle through playable tracks, follow your ears and save the sounds worth returning to.</p>

        <form
          class="waitlist-form"
          id="waitlist-form"
          action="https://submit-form.com/PhvdbIM22"
          method="POST">
          <label class="sr-only" for="waitlist-email">Email address</label>
          <input id="waitlist-email" name="email" type="email" autocomplete="email" inputmode="email" placeholder="Enter your email" maxlength="254" required>
          <input class="honeypot" name="website" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">
          <button type="submit">Join waitlist</button>
        </form>
        <div class="waitlist-meta">
          <span>Built for curious ears.</span>
          <a href="privacy.html">Privacy</a>
          <a href="terms.html">Terms</a>
        </div>
      </div>

      <div class="hero-visual" aria-label="Preview of the CrateSeek Discover screen">
        <div class="phone" aria-hidden="true">
          <div class="phone-island"></div>
          <div class="phone-screen">
            <img class="app-screenshot" src="assets/discover-rick-astley.png" alt="" width="853" height="1845">
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
